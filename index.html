<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YU工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7CB342">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FFFFFF'/><stop offset='0.5' stop-color='%23A3C910'/><stop offset='1' stop-color='%237B4FBF'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='65' text-anchor='middle' fill='%23FFFFFF' font-size='42' font-weight='bold' font-family='sans-serif'>YU</text></svg>">
<title>YU · 太空工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --buzz-white: #FFFFFF;
    --buzz-green: #A3C910;
    --buzz-green-dark: #7CB342;
    --buzz-purple: #7B4FBF;
    --buzz-purple-light: #E8E0F5;
    --buzz-red: #E53935;
    --buzz-orange: #FF7043;
    --buzz-gray: #F2F4F5;
    --buzz-border: #E8ECED;
    --text: #2C3E50;
    --text-light: #90A4AE;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 16px;
    --nav-width: 76px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #F5F6F7;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(163,201,16,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(123,79,191,0.06) 0%, transparent 50%);
  }
  #app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--buzz-gray);
    position: relative;
    overflow: hidden;
    box-shadow: -8px 0 24px rgba(0,0,0,0.04), 8px 0 24px rgba(0,0,0,0.04);
  }

  /* ===== 左侧导航 ===== */
  .sidebar {
    width: var(--nav-width);
    flex-shrink: 0;
    background: linear-gradient(180deg, #FFFFFF 0%, #F8FAF5 60%, #F5F2FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 8px 12px;
    gap: 4px;
    overflow-y: auto;
    border-right: 1px solid rgba(0,0,0,0.05);
    z-index: 10;
  }
  .sidebar-logo {
    width: 46px; height: 46px;
    background: linear-gradient(135deg, var(--buzz-green), var(--buzz-purple));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin-bottom: 16px;
    flex-shrink: 0;
    box-shadow: 0 3px 14px rgba(163,201,16,0.3);
    position: relative;
  }
  .sidebar-logo::after {
    content: 'W';
    position: absolute;
    font-size: 12px; font-weight: 800; color: #fff;
    bottom: 2px; right: 2px;
    background: var(--buzz-red);
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 0; border-radius: 14px; cursor: pointer;
    transition: all 0.2s; width: 100%; position: relative;
  }
  .nav-item.active {
    background: rgba(163,201,16,0.12);
  }
  .nav-item.active::before {
    content: '';
    position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; background: var(--buzz-green);
    border-radius: 0 3px 3px 0;
  }
  .nav-icon {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; transition: all 0.2s;
  }
  .nav-item.active .nav-icon { transform: scale(1.08); }
  .nav-label { font-size: 10px; color: var(--text-light); margin-top: 2px; text-align: center; }
  .nav-item.active .nav-label { color: var(--buzz-green-dark); font-weight: 600; }

  /* 图标色 — 巴斯光年风格：白色底 + 彩色边框 */
  .ic-diet { background: #F1F8E9; color: #7CB342; border: 2px solid #C5E1A5; }
  .ic-news { background: #EDE7F6; color: #5E35B1; border: 2px solid #D1C4E9; }
  .ic-idea { background: #E8EAF6; color: #7B4FBF; border: 2px solid #C5CAE9; }
  .ic-dy { background: #FFF8E1; color: #FF8F00; border: 2px solid #FFE082; }
  .ic-account { background: #E8F5E9; color: #2E7D32; border: 2px solid #A5D6A7; }
  .ic-english { background: #E0F2F1; color: #00695C; border: 2px solid #80CBC4; }
  .ic-todo { background: #FFEBEE; color: #C62828; border: 2px solid #EF9A9A; }

  /* ===== 右侧主内容 ===== */
  .main-area {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  .header-bar {
    flex-shrink: 0;
    background: linear-gradient(135deg, #FFFFFF 0%, #E8F5E9 30%, #A3C910 70%, #7B4FBF 100%);
    padding: 18px 16px 16px;
    border-radius: 0 0 22px 22px;
    color: #fff;
    position: relative;
    z-index: 5;
    box-shadow: 0 4px 20px rgba(163,201,16,0.2);
    overflow: hidden;
  }
  .header-bar::before {
    content: '';
    position: absolute; top: -30px; right: -20px;
    width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header-bar::after {
    content: '✦';
    position: absolute; top: 10px; right: 60px;
    font-size: 10px; opacity: 0.4; color: #fff;
  }
  .header-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; position: relative; z-index: 1;
  }
  .header-title { font-size: 20px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.15); }
  .header-date { font-size: 12px; opacity: 0.9; }
  .header-date .date-num { font-size: 22px; font-weight: 700; display: block; opacity: 1; }

  /* 打卡卡片 */
  .checkin-mini {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.22);
    border-radius: 14px;
    padding: 12px 14px; margin-top: 6px;
    backdrop-filter: blur(4px);
    position: relative; z-index: 1;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .checkin-progress-wrap { flex: 1; }
  .checkin-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .checkin-bar {
    height: 6px; background: rgba(255,255,255,0.3);
    border-radius: 3px; overflow: hidden;
  }
  .checkin-bar-fill {
    height: 100%; background: #fff; border-radius: 3px;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
  }
  .checkin-num { font-size: 24px; font-weight: 700; white-space: nowrap; }

  /* 内容滚动区 */
  .content-scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 12px 12px 20px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .content-scroll::-webkit-scrollbar { width: 0; }

  /* ===== 模块区域 ===== */
  .module-panel { display: none; }
  .module-panel.active { display: block; animation: slideIn 0.25s ease; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ===== 卡片 ===== */
  .card {
    background: var(--buzz-white);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--buzz-border);
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--buzz-green), var(--buzz-purple));
    border-radius: var(--radius) var(--radius) 0 0;
    opacity: 0.5;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .card-title-row { display: flex; align-items: center; gap: 10px; }
  .card-icon {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .card-title { font-size: 17px; font-weight: 700; }
  .card-subtitle { font-size: 11px; color: var(--text-light); }

  /* ===== 列表项 ===== */
  .li-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 0; border-bottom: 1px solid var(--buzz-border);
    gap: 10px;
  }
  .li-row:last-child { border-bottom: none; }
  .li-content { flex: 1; min-width: 0; }
  .li-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
  .li-desc { font-size: 12px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 徽章 */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600;
  }
  .b-green { background: #F1F8E9; color: #558B2F; }
  .b-blue { background: #EDE7F6; color: #4527A0; }
  .b-red { background: #FFEBEE; color: #C62828; }
  .b-orange { background: #FFF3E0; color: #E65100; }
  .b-purple { background: #F3E5F5; color: #6A1B9A; }

  /* 打卡按钮 — 巴斯光年红按钮风格 */
  .btn-check {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--buzz-green-dark);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    font-size: 14px; color: transparent;
  }
  .btn-check.done {
    background: linear-gradient(135deg, var(--buzz-green), var(--buzz-green-dark));
    border-color: var(--buzz-green-dark);
    color: #fff; font-weight: 700;
    box-shadow: 0 2px 8px rgba(163,201,16,0.35);
  }

  /* 统计行 */
  .stat-row { display: flex; gap: 8px; margin-top: 8px; }
  .stat-box {
    flex: 1; background: #F8FAF5; border-radius: 12px;
    padding: 10px 8px; text-align: center;
  }
  .stat-val { font-size: 18px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: var(--text-light); margin-top: 2px; }

  /* 进度条 */
  .mini-bar {
    height: 5px; background: #EEEEEE; border-radius: 3px;
    overflow: hidden; margin-top: 5px;
  }
  .mini-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
  .mf-green { background: linear-gradient(90deg, #A3C910, #7CB342); }
  .mf-blue { background: linear-gradient(90deg, #7B4FBF, #5E35B1); }
  .mf-orange { background: linear-gradient(90deg, #FF9800, #FF7043); }
  .mf-red { background: linear-gradient(90deg, #EF5350, #E53935); }

  /* 建议/提示盒 */
  .tip-box {
    background: #F8FAF5; border-radius: 12px; padding: 12px; margin-top: 10px;
    border-left: 3px solid var(--buzz-green);
  }
  .tip-box.blue-border { border-left-color: var(--buzz-purple); }
  .tip-box.orange-border { border-left-color: var(--buzz-orange); }
  .tip-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .tip-row { font-size: 12px; color: var(--text-light); margin-bottom: 3px; line-height: 1.5; }

  /* 热点条目 */
  .hot-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid #F5F5F5;
  }
  .hot-rank {
    width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .hr-1 { background: #FFEBEE; color: #C62828; }
  .hr-2 { background: #FFF3E0; color: #E65100; }
  .hr-3 { background: #FFFDE7; color: #F9A825; }
  .hr-n { background: #F5F5F5; color: #999; }
  .hot-txt { flex: 1; font-size: 13px; color: var(--text); line-height: 1.4; }
  .hot-meta { font-size: 11px; color: var(--text-light); }

  /* 灵感/选题卡片 */
  .idea-card {
    background: #F5F2FA; border-radius: 12px; padding: 10px 12px;
    margin-bottom: 8px;
  }
  .idea-card.accent-green { background: #F1F8E9; }
  .idea-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .idea-desc { font-size: 11px; color: var(--text-light); line-height: 1.5; }
  .stars { color: #FFB300; font-size: 11px; }

  /* 输入框 */
  input, textarea {
    border: 1.5px solid #E0E0E0; border-radius: 10px;
    padding: 8px 10px; font-size: 14px; font-family: inherit;
    background: #FAFAFA; color: var(--text);
    -webkit-appearance: none; transition: border 0.2s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--buzz-green); background: #fff; box-shadow: 0 0 0 3px rgba(163,201,16,0.1); }
  textarea { width: 100%; resize: vertical; min-height: 60px; }
  .input-sm { width: 70px; text-align: center; }
  .input-full { width: 100%; }

  /* 按钮 */
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 16px; border-radius: 20px; font-size: 13px;
    font-weight: 600; border: none; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--buzz-green), var(--buzz-green-dark));
    color: #fff; box-shadow: 0 2px 8px rgba(163,201,16,0.3);
  }
  .btn-outline {
    background: #fff; color: var(--buzz-green-dark); border: 1.5px solid var(--buzz-green-dark);
  }
  .btn-sm { padding: 5px 12px; font-size: 11px; }
  .btn-danger { background: #FFEBEE; color: var(--buzz-red); border: 1px solid #FFCDD2; }
  .btn-full { width: 100%; justify-content: center; margin-top: 8px; }

  /* 日程行 */
  .sched-row {
    display: flex; align-items: center; padding: 7px 0;
    border-bottom: 1px solid #F5F5F5; gap: 8px;
  }
  .sched-day {
    width: 42px; font-size: 12px; font-weight: 700; color: var(--text-light);
  }
  .sched-txt { flex: 1; font-size: 13px; }

  /* 词汇 */
  .vocab-row { padding: 9px 0; border-bottom: 1px solid #F5F5F5; }
  .vocab-word { font-size: 14px; font-weight: 600; }
  .vocab-phon { font-size: 11px; color: var(--text-light); margin-left: 6px; }
  .vocab-mean { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .vocab-ex { font-size: 11px; color: #BDBDBD; font-style: italic; margin-top: 2px; }

  /* 对话 */
  .dialogue-box {
    background: #F8FAF5; border-radius: 12px; padding: 10px 12px;
    margin: 8px 0;
  }
  .dial-line { font-size: 13px; color: var(--text); margin-bottom: 5px; }
  .dial-speaker { font-weight: 700; color: var(--buzz-green-dark); }

  /* 支出输入行 */
  .exp-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
  }
  .exp-label { width: 50px; font-size: 13px; flex-shrink: 0; }

  /* Tab */
  .tab-row {
    display: flex; gap: 6px; margin-bottom: 12px;
    overflow-x: auto; scrollbar-width: none; flex-wrap: wrap;
  }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 5px 12px; border-radius: 14px; font-size: 12px;
    background: #F5F5F5; color: var(--text-light); border: none;
    cursor: pointer; white-space: nowrap; font-family: inherit;
    transition: all 0.2s;
  }
  .tab-btn.active { background: var(--buzz-green); color: #fff; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 24px;
    border-radius: 24px; font-size: 13px; z-index: 999;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .toast.show { opacity: 1; }

  /* 清空/导出按钮 */
  .action-row {
    display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
  }

  /* 待办 */
  .todo-input-row {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .todo-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid #F5F5F5;
  }
  .todo-circle {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #BDBDBD; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-size: 12px; color: transparent;
  }
  .todo-circle.done {
    background: var(--buzz-green); border-color: var(--buzz-green);
    color: #fff;
  }
  .todo-text { flex: 1; font-size: 14px; }
  .todo-text.completed { text-decoration: line-through; color: #BDBDBD; }
  .todo-del { color: #BDBDBD; cursor: pointer; font-size: 16px; padding: 2px 6px; }

  /* 编辑按钮 */
  .edit-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: #F5F5F5; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; border: none; color: var(--text-light);
    transition: all 0.2s;
  }
  .edit-btn:hover { background: #E0E0E0; }

  /* 模态框 */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-sheet {
    background: #fff; border-radius: 20px 20px 0 0;
    padding: 20px; width: 100%; max-width: 480px;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }

  /* 响应式 */
  @media (min-width: 481px) {
    #app { border-radius: 0; box-shadow: none; }
  }

  /* ===== 巴斯光年卡通形象 ===== */
  .buzz-lightyear {
    position: relative; width: 38px; height: 42px; flex-shrink: 0; margin-bottom: 8px;
  }
  .buzz-head {
    width: 32px; height: 30px; background: #FAFAFA;
    border-radius: 50% 50% 40% 40%; margin: 0 auto;
    position: relative; z-index: 2;
    border: 2px solid #E0E0E0;
  }
  .buzz-helmet {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 20px;
    background: linear-gradient(180deg, rgba(163,201,16,0.5) 0%, rgba(163,201,16,0.15) 100%);
    border-radius: 50% 50% 0 0; z-index: 3;
    border: 1.5px solid rgba(123,79,191,0.3);
  }
  .buzz-visor {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 14px;
    background: rgba(123,79,191,0.25);
    border-radius: 50% 50% 40% 40%; z-index: 4;
  }
  .buzz-eyes {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; z-index: 5;
  }
  .buzz-eye {
    width: 6px; height: 7px; background: #2C3E50; border-radius: 50%;
  }
  .buzz-chin {
    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 10px; background: #FAFAFA;
    border-radius: 0 0 50% 50%; z-index: 1;
    border: 2px solid #E0E0E0; border-top: none;
  }
  .buzz-body {
    width: 20px; height: 8px; background: var(--buzz-green);
    margin: -1px auto 0; border-radius: 0 0 6px 6px;
    position: relative; z-index: 0;
  }
  .buzz-red-btn {
    width: 6px; height: 6px; background: var(--buzz-red);
    border-radius: 50%; margin: -3px auto 0;
    position: relative; z-index: 1;
  }

  /* ===== 三眼仔卡通形象 ===== */
  .alien-toy {
    position: relative; width: 36px; height: 40px; flex-shrink: 0;
  }
  .alien-body {
    width: 32px; height: 30px; background: linear-gradient(180deg, #81C784 0%, #66BB6A 100%);
    border-radius: 50% 50% 45% 45%; margin: 0 auto;
    position: relative;
  }
  .alien-antenna {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 12px; background: #7B4FBF; border-radius: 2px;
  }
  .alien-antenna::after {

  { name:'玉米(1根)', protein:4, carb:22, fat:1.5, kcal:112 },
  { name:'金枪鱼罐头(100g)', protein:25, carb:0, fat:1, kcal:110 }
];

function renderDietPanel() {
  const m = appData.diet.meals;
  const p = appData.diet.plan;
  const fl = appData.diet.foodLog || { breakfast: [], lunch: [], dinner: [], snack: [] };
  const w = appData.diet.weight || { today: 65.0, target: 58.0, history: {} };
  const cp = appData.diet.currentPlan || 'maintain';
  const todayStr = getTodayStr();

  // 汇总各餐营养
  const calcMeal = (arr) => ({
    pro: arr.reduce((s,f)=>s+(f.protein||0),0),
    carb: arr.reduce((s,f)=>s+(f.carb||0),0),
    fat: arr.reduce((s,f)=>s+(f.fat||0),0),
    kcal: arr.reduce((s,f)=>s+(f.kcal||0),0)
  });
  const bTot = calcMeal(fl.breakfast);
  const lTot = calcMeal(fl.lunch);
  const dTot = calcMeal(fl.dinner);
  const sTot = calcMeal(fl.snack);
  const total = {
    protein: bTot.pro+lTot.pro+dTot.pro+sTot.pro,
    carb: bTot.carb+lTot.carb+dTot.carb+sTot.carb,
    fat: bTot.fat+lTot.fat+dTot.fat+sTot.fat,
    kcal: bTot.kcal+lTot.kcal+dTot.kcal+sTot.kcal
  };

  const diff = (w.today - w.target).toFixed(1);
  const isLoss = diff > 0;
  const diffText = isLoss ? `还需减 ${diff} kg` : diff < 0 ? `还需增 ${Math.abs(diff).toFixed(1)} kg` : '已达成目标！';

  const trendDays = [];
  const d = new Date();
  for (let i = 6; i >= 0; i--) {
    const td = new Date(d); td.setDate(td.getDate() - i);
    const key = td.getFullYear()+'-'+String(td.getMonth()+1).padStart(2,'0')+'-'+String(td.getDate()).padStart(2,'0');
    trendDays.push({ key, label: td.getMonth()+1+'/'+td.getDate(), val: w.history[key]||null });
  }
  const vals = trendDays.filter(d=>d.val!==null).map(d=>d.val);
  const vMin = vals.length>0?Math.min(...vals):w.today-5;
  const vMax = vals.length>0?Math.max(...vals):w.today+5;
  const vRange = Math.max(vMax-vMin,1);

  const mealKeys = ['breakfast','lunch','dinner','snack'];
  const mealTotals = [bTot, lTot, dTot, sTot];

  const renderMealBlock = (key, i) => {
    const foods = fl[key] || [];
    const tot = mealTotals[i];
    return `
    <div class="meal-block">
      <div class="meal-block-header">
        <span style="font-weight:600;font-size:14px;">${mealLabels[key]}</span>
        <span style="font-size:11px;color:var(--text-light);">P:${tot.pro.toFixed(1)}g C:${tot.carb.toFixed(1)}g F:${tot.fat.toFixed(1)}g 🔥${tot.kcal.toFixed(0)}kcal</span>
      </div>
      ${foods.map((f,fi) => `
      <div class="food-item">
        <span class="food-name">🍴 ${f.name}</span>
        <span class="food-nutri">P${f.protein}g C${f.carb}g F${f.fat}g ${f.kcal}kcal</span>
        <span class="food-del" data-meal="${key}" data-idx="${fi}">×</span>
      </div>`).join('')}
      ${foods.length === 0 ? '<div style="font-size:11px;color:#ccc;padding:4px 0;">暂无记录</div>' : ''}
    </div>`;
  };

  return `
<div class="module-panel" id="panel-diet">
  <div class="card">
    <div class="card-header">
      <div class="card-title-row">
        <div class="card-icon ic-diet">🍽️</div>
        <div><div class="card-title">每日饮食</div><div class="card-subtitle">Keep 风格 · 食物录入 + 自动计算</div></div>
      </div>
    </div>

    <!-- 📊 今日营养概览 -->
    <div class="nutri-overview">
      <div class="nutri-row">
        <div class="nutri-item"><div class="nutri-val" style="color:#7CB342;">${total.protein.toFixed(0)}<span class="nutri-unit">/${p.protein}g</span></div><div class="nutri-lbl">蛋白质</div><div class="mini-bar"><div class="mini-bar-fill mf-green" style="width:${Math.min(100,(total.protein/p.protein)*100)}%"></div></div></div>
        <div class="nutri-item"><div class="nutri-val" style="color:#FF8F00;">${total.carb.toFixed(0)}<span class="nutri-unit">/${p.carb}g</span></div><div class="nutri-lbl">碳水</div><div class="mini-bar"><div class="mini-bar-fill mf-orange" style="width:${Math.min(100,(total.carb/p.carb)*100)}%"></div></div></div>
      </div>
      <div class="nutri-row">
        <div class="nutri-item"><div class="nutri-val" style="color:#E53935;">${total.fat.toFixed(0)}<span class="nutri-unit">/${p.fat}g</span></div><div class="nutri-lbl">脂肪</div><div class="mini-bar"><div class="mini-bar-fill mf-red" style="width:${Math.min(100,(total.fat/p.fat)*100)}%"></div></div></div>
        <div class="nutri-item"><div class="nutri-val" style="color:#7B4FBF;">${total.kcal.toFixed(0)}<span class="nutri-unit">/${p.kcal}kcal</span></div><div class="nutri-lbl">热量</div><div class="mini-bar"><div class="mini-bar-fill mf-blue" style="width:${Math.min(100,(total.kcal/p.kcal)*100)}%"></div></div></div>
      </div>
    </div>

    <!-- 打卡 -->
    <div class="li-row"><div class="li-content"><div class="li-title">🥣 早餐打卡</div></div><div class="btn-check${m.breakfast?' done':''}" data-key="diet.meals.breakfast">✓</div></div>
    <div class="li-row"><div class="li-content"><div class="li-title">🍗 午餐打卡</div></div><div class="btn-check${m.lunch?' done':''}" data-key="diet.meals.lunch">✓</div></div>
    <div class="li-row"><div class="li-content"><div class="li-title">🥗 晚餐打卡</div></div><div class="btn-check${m.dinner?' done':''}" data-key="diet.meals.dinner">✓</div></div>
    <div class="li-row"><div class="li-content"><div class="li-title">💊 加餐/补剂打卡</div></div><div class="btn-check${m.supplement?' done':''}" data-key="diet.meals.supplement">✓</div></div>

    <!-- 🔍 添加食物 -->
    <div class="add-food-section">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">🔍 添加食物</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <select id="food-meal" style="flex:1;padding:8px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;background:#FAFAFA;">
          <option value="breakfast">🥣 早餐</option><option value="lunch">🍗 午餐</option><option value="dinner">🥗 晚餐</option><option value="snack">🍪 加餐</option>
        </select>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:6px;">📦 常用食物（点击即添加）</div>
      <div class="food-grid">
        ${foodDB.map(f => `
        <div class="food-chip" data-name="${f.name}" data-pro="${f.protein}" data-carb="${f.carb}" data-fat="${f.fat}" data-kcal="${f.kcal}">
          ${f.name.split('(')[0]}
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <input id="food-custom-name" placeholder="自定义食物名" style="flex:1;font-size:13px;">
      </div>
      <div style="display:flex;gap:6px;margin-top:4px;">
        <input id="food-custom-pro" type="number" placeholder="蛋白质g" style="width:25%;font-size:12px;" step="0.1">
        <input id="food-custom-carb" type="number" placeholder="碳水g" style="width:25%;font-size:12px;" step="0.1">
        <input id="food-custom-fat" type="number" placeholder="脂肪g" style="width:25%;font-size:12px;" step="0.1">
        <input id="food-custom-kcal" type="number" placeholder="热量kcal" style="width:25%;font-size:12px;">
      </div>
      <button class="btn btn-primary btn-full" id="food-add-custom">➕ 添加自定义食物</button>
    </div>

    <!-- 🍱 今日食物记录 -->
    <div style="margin-top:14px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">🍱 今日食物记录</div>
      ${mealKeys.map((k,i) => renderMealBlock(k,i)).join('')}
      <button class="btn btn-sm btn-danger btn-full" id="food-clear-all">🗑 清空今日记录</button>
    </div>

    <!-- ⚖️ 体重管理 -->
    <div class="weight-section" style="margin-top:14px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;">⚖️ 体重管理</div>
      <div class="weight-input-row">
        <div class="weight-label">今日体重</div>
        <input class="input-sm" id="weight-today" type="number" step="0.1" value="${w.today}" style="width:80px;">
        <span class="weight-unit">kg</span>
      </div>
      <div class="weight-input-row">
        <div class="weight-label">目标体重</div>
        <input class="input-sm" id="weight-target" type="number" step="0.1" value="${w.target}" style="width:80px;">
        <span class="weight-unit">kg</span>
        <span class="weight-diff">${diffText}</span>
      </div>
      <button class="btn btn-sm btn-primary" id="weight-save" style="margin-bottom:8px;">💾 记录体重</button>
      <div style="font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:4px;">📈 近7天趋势</div>
      <div class="weight-trend">
        ${trendDays.map(d => {
          const h = d.val !== null ? Math.max(8, ((d.val - vMin) / vRange) * 42) : 8;
          const isToday = d.key === todayStr;
          return `<div class="weight-bar-wrap"><div class="weight-bar" style="height:${h}px;${isToday?'background:linear-gradient(180deg,var(--buzz-purple),var(--buzz-green-dark));box-shadow:0 0 6px rgba(123,79,191,0.3);':''}"></div><div class="weight-bar-label">${d.label}</div></div>`;
        }).join('')}
      </div>
    </div>

    <!-- 饮食方案 -->
    <div style="margin-top:16px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">📋 饮食方案</div>
      <div class="plan-tabs">
        ${Object.entries(mealPlans).map(([key,plan]) => `<div class="plan-tab${cp===key?' active':''}" data-plan="${key}">${plan.emoji} ${plan.name}</div>`).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
        <div style="flex:1;min-width:60px;"><div style="font-size:10px;color:#999;">蛋白质目标</div><input class="input-sm" id="diet-pro" type="number" value="${p.protein}" style="width:100%;"> g</div>
        <div style="flex:1;min-width:60px;"><div style="font-size:10px;color:#999;">碳水目标</div><input class="input-sm" id="diet-carb" type="number" value="${p.carb}" style="width:100%;"> g</div>
        <div style="flex:1;min-width:60px;"><div style="font-size:10px;color:#999;">脂肪目标</div><input class="input-sm" id="diet-fat" type="number" value="${p.fat}" style="width:100%;"> g</div>
        <div style="flex:1;min-width:60px;"><div style="font-size:10px;color:#999;">热量目标</div><input class="input-sm" id="diet-kcal" type="number" value="${p.kcal}" style="width:100%;"> kcal</div>
      </div>
      <div style="font-size:11px;color:var(--text-light);margin-top:6px;">💡 点击上方方案自动填入，也可手动修改后保存</div>
      <button class="btn btn-primary btn-full" id="diet-save-plan">保存饮食计划</button>
    </div>
  </div>
</div>`;
}

function bindDietEvents() {
  // 食物库点击添加
  document.querySelectorAll('.food-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const meal = $('#food-meal')?.value || 'breakfast';
      const food = {
        name: chip.dataset.name,
        protein: parseFloat(chip.dataset.pro),
        carb: parseFloat(chip.dataset.carb),
        fat: parseFloat(chip.dataset.fat),
        kcal: parseFloat(chip.dataset.kcal)
      };
      if (!appData.diet.foodLog) appData.diet.foodLog = { breakfast:[], lunch:[], dinner:[], snack:[] };
      appData.diet.foodLog[meal].push(food);
      saveData(appData);
      renderAll();
      toast('已添加「'+chip.dataset.name.split('(')[0]+'」到 '+mealLabels[meal]+' ✅');
    });
  });

  // 自定义食物添加
  $('#food-add-custom')?.addEventListener('click', () => {
    const name = $('#food-custom-name')?.value?.trim();
    if (!name) { toast('请输入食物名称'); return; }
    const pro = parseFloat($('#food-custom-pro')?.value) || 0;
    const carb = parseFloat($('#food-custom-carb')?.value) || 0;
    const fat = parseFloat($('#food-custom-fat')?.value) || 0;
    const kcal = parseFloat($('#food-custom-kcal')?.value) || 0;
    const meal = $('#food-meal')?.value || 'breakfast';
    if (!appData.diet.foodLog) appData.diet.foodLog = { breakfast:[], lunch:[], dinner:[], snack:[] };
    appData.diet.foodLog[meal].push({ name, protein:pro, carb, fat, kcal });
    saveData(appData);
    renderAll();
    toast('已添加「'+name+'」✅');
  });

  // 删除单个食物（事件委托）
  document.querySelectorAll('.food-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const meal = btn.dataset.meal;
      const idx = parseInt(btn.dataset.idx);
      if (appData.diet.foodLog && appData.diet.foodLog[meal]) {
        const removed = appData.diet.foodLog[meal][idx];
        appData.diet.foodLog[meal].splice(idx, 1);
        saveData(appData);
        renderAll();
        toast('已删除「'+removed.name+'」');
      }
    });
  });

  // 清空今日
  $('#food-clear-all')?.addEventListener('click', () => {
    if (confirm('确定清空今日所有食物记录？')) {
      appData.diet.foodLog = { breakfast:[], lunch:[], dinner:[], snack:[] };
      saveData(appData);
      renderAll();
      toast('已清空 ✅');
    }
  });

  // 饮食方案 Tab 切换
  document.querySelectorAll('.plan-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const planKey = tab.dataset.plan;
      const plan = mealPlans[planKey];
      if (!plan) return;
      appData.diet.currentPlan = planKey;
      const proEl = $('#diet-pro'), carbEl = $('#diet-carb'), fatEl = $('#diet-fat'), kcalEl = $('#diet-kcal');
      if (proEl) proEl.value = plan.protein;
      if (carbEl) carbEl.value = plan.carb;
      if (fatEl) fatEl.value = plan.fat;
      if (kcalEl) kcalEl.value = plan.kcal;
      document.querySelectorAll('.plan-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      saveData(appData);
      toast('已切换至「' + plan.name + '」✅');
    });
  });

  // 体重保存
  $('#weight-save')?.addEventListener('click', () => {
    const todayVal = parseFloat($('#weight-today')?.value);
    const targetVal = parseFloat($('#weight-target')?.value);
    if (isNaN(todayVal) || isNaN(targetVal)) { toast('请输入有效数字'); return; }
    if (!appData.diet.weight) appData.diet.weight = { today: 65.0, target: 58.0, history: {} };
    appData.diet.weight.today = todayVal;
    appData.diet.weight.target = targetVal;
    const todayStr = getTodayStr();
    appData.diet.weight.history[todayStr] = todayVal;
    saveData(appData);
    renderAll();
    toast('体重已记录 ✅');
  });

  $('#diet-save-plan')?.addEventListener('click', () => {
    appData.diet.plan.protein = +($('#diet-pro')?.value || 120);
    appData.diet.plan.carb = +($('#diet-carb')?.value || 200);
    appData.diet.plan.fat = +($('#diet-fat')?.value || 50);
    appData.diet.plan.kcal = +($('#diet-kcal')?.value || 2000);
    saveData(appData);
    renderAll();
    toast('饮食计划已保存 ✅');
  });
}

function bindAccountEvents() {

    appData.account.income = +($('#acc-income')?.value || 0);
    appData.account.expenses.food = +($('#acc-food')?.value || 0);
    appData.account.expenses.traffic = +($('#acc-traffic')?.value || 0);
    appData.account.expenses.shop = +($('#acc-shop')?.value || 0);
    appData.account.expenses.ent = +($('#acc-ent')?.value || 0);
    appData.account.expenses.gym = +($('#acc-gym')?.value || 0);
    appData.account.expenses.other = +($('#acc-other')?.value || 0);
    const mk = getThisMonth();
    const te = Object.values(appData.account.expenses).reduce((a,b)=>a+b,0);
    appData.account.monthly[mk] = { income: appData.account.income, expenses: te };
    saveData(appData);
    renderAll();
    switchPanel('account');
    toast('收支已保存 ✅');
  });
  $('#acc-budget-save')?.addEventListener('click', () => {

    saveData(appData);
    renderAll();
    switchPanel('account');

  });

    if (confirm('确定要清空本月数据吗？此操作不可撤销。')) {

      delete appData.account.monthly[mk];
      appData.account.income = 0;

      saveData(appData);

  $('#acc-export')?.addEventListener('click', () => {

    const blob = new Blob([data], { type: 'application/json' });

    a.href = url; a.download = 'account-data.json'; a.click();

    toast('数据已导出 ✅');

}

function bindTodoEvents() {
  $('#todo-add')?.addEventListener('click', () => {
    const input = $('#todo-input');
    const text = input?.value?.trim();
    if (!text) return;
    appData.todo.items.push({ text, done: false, daily: true });
    saveData(appData);
    renderAll();
    switchPanel('todo');
    toast('待办已添加 ✅');
  });

  $('#todo-list')?.addEventListener('click', (e) => {
    const circle = e.target.closest('.todo-circle');
    const del = e.target.closest('.todo-del');
    const idx = +(circle?.dataset.index ?? del?.dataset.index);
    if (isNaN(idx)) return;

    if (circle) {
      appData.todo.items[idx].done = !appData.todo.items[idx].done;
      saveData(appData);
      renderAll();
      switchPanel('todo');
    }
    if (del) {
      appData.todo.items.splice(idx, 1);
      saveData(appData);
      renderAll();
      switchPanel('todo');
      toast('已删除');
    }
  });

  $('#todo-clear-done')?.addEventListener('click', () => {
    appData.todo.items = appData.todo.items.filter(t => !t.done);
    saveData(appData);
    renderAll();
    switchPanel('todo');
    toast('已清除完成项 ✅');
  });

  $('#todo-clear-all')?.addEventListener('click', () => {
    if (confirm('确定清空所有待办事项？')) {
      appData.todo.items = [];
      saveData(appData);
      renderAll();
      switchPanel('todo');
      toast('已清空全部');
    }
  });
}

function openVideo(keyword) {
  const modal = $('#videoModal');
  const frame = $('#videoFrame');
  if (!modal || !frame) return;
  const encoded = encodeURIComponent(keyword);
  frame.src = 'https://www.douyin.com/search/' + encoded + '?type=general';
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeVideo() {
  const modal = $('#videoModal');
  const frame = $('#videoFrame');
  if (!modal) return;
  frame.src = '';
  modal.style.display = 'none';
  document.body.style.overflow = '';
}

// 视频模态窗事件
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    $('#videoClose')?.addEventListener('click', closeVideo);
    $('#videoModal')?.addEventListener('click', (e) => {
      if (e.target === $('#videoModal')) closeVideo();
    });
  }, 500);
});

    }
  }
  if (changed) saveData(appData);
}, 5000);
